# Package source. Bump objectindex_version to upgrade; pip detects the changed
# ref and reinstalls. Idempotent at the same tag.
objectindex_version: v0.3.2
objectindex_git_url: https://github.com/ctengel/objectindex

# Install layout. The systemd unit uses %h/venv as the default venv path;
# override with a drop-in (`systemctl --user edit objectindex-api`) if you
# change it here.
objectindex_venv: "{{ ansible_env.HOME }}/venv"

# Config and unit directories (matches %E and %h/.config/systemd/user in the
# unit file).
objectindex_config_dir: "{{ ansible_env.HOME }}/.config/objectindex"
objectindex_systemd_user_dir: "{{ ansible_env.HOME }}/.config/systemd/user"

objectindex_unit: objectindex-api.service

# API runtime knobs (override per host in inventory). objidx_database_url,
# objidx_s3, and objidx_buckets are required and have no default — set them in
# inventory.
objectindex_host: "0.0.0.0"
objectindex_port: 29161
objectindex_workers: 1
