[project]
name = "objectindex"
version = "0.2.5"
description = "Object Index allows you to index your objexts in S3"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "ctengel"}]
keywords = ["object", "s3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha", 
  "Environment :: Web Environment",
  "Natural Language :: English"
]
dependencies = [
  'fastapi >= 0.110',
  'uvicorn[standard] >= 0.27',
  'pydantic-settings >= 2.0',
  'flask >= 2.1',
  'requests >= 2.27',
  'psycopg2 >= 2.9',
  'sqlalchemy >= 2.0'
]

[project.optional-dependencies]
# flask-restx/flask-sqlalchemy enable the optional legacy cross-check in
# tests/oilegacy (skipped automatically when they are absent).
test = ['pytest >= 7', 'flask-restx >= 1.0', 'flask-sqlalchemy >= 3.0']

[project.urls]
repository = "https://github.com/ctengel/objectindex"

[project.scripts]
obj-idx-client = "obj_idx.cli:cli"

[tool.setuptools.packages.find]
include = ["obj_idx"]
