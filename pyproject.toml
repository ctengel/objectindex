[project]
name = "objectindex"
version = "0.3.3"
description = "Object Index allows you to index your objexts in S3"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "ctengel"}]
keywords = ["object", "s3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha", 
  "Environment :: Web Environment",
  "Natural Language :: English"
]
dependencies = [
  'fastapi >= 0.110',
  'uvicorn[standard] >= 0.27',
  'pydantic-settings >= 2.2',
  'sqlmodel >= 0.0.38',
  'flask >= 2.1',
  'requests >= 2.27',
  'simpler-objects >= 0.4',
  'psycopg2 >= 2.9',
  'sqlalchemy >= 2.0',
  'file-magic >= 0.4'
]

[project.optional-dependencies]
# httpx backs FastAPI's TestClient, which the contract suite runs in-process.
test = ['pytest >= 7', 'httpx >= 0.27']

[project.urls]
repository = "https://github.com/ctengel/objectindex"

[project.scripts]
obj-idx-client = "obj_idx.cli:cli"

[tool.setuptools.packages.find]
include = ["obj_idx"]
